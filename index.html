<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apple Music Adaptive Flow — Prototype</title>
<style>
:root{--bg:#f2f2f7;--tx:#1c1c1e;--mu:#6e6e73;--pn:#fff;--bd:#d8d8de;--ac:#fa2d48;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0b0d;--tx:#f5f5f7;--mu:#98989f;--pn:#1c1c1e;--bd:#2c2c2e}}
:root[data-theme=dark]{--bg:#0b0b0d;--tx:#f5f5f7;--mu:#98989f;--pn:#1c1c1e;--bd:#2c2c2e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;min-height:100vh}
.app{display:flex;gap:40px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding:28px 16px}
.rail{width:300px;max-width:100%}
.rail h2{font:700 22px/1.2 inherit;letter-spacing:-.02em;margin-bottom:6px}
.rail p.s{color:var(--mu);font-size:13px;margin-bottom:18px}
.st{display:flex;gap:12px;width:100%;text-align:left;background:none;border:0;border-left:2px solid var(--bd);padding:8px 12px;color:var(--mu);cursor:pointer;font:inherit}
.st b{color:var(--tx);font-weight:600;display:block;font-size:14px}.st small{font-size:12px}
.st.on{border-color:var(--ac);color:var(--tx);background:var(--pn)}
.st:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.note{margin-top:16px;font-size:12px;color:var(--mu)}
.wrap{width:calc(393px*var(--s,1));height:calc(852px*var(--s,1))}
.ph{width:393px;height:852px;transform:scale(var(--s,1));transform-origin:0 0;background:#000;color:#fff;border-radius:52px;border:9px solid #2a2a2e;position:relative;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.sb{position:absolute;top:0;left:0;right:0;height:46px;display:flex;justify-content:space-between;align-items:center;padding:6px 32px 0;font-weight:600;font-size:15px;z-index:5}
.scr{position:absolute;inset:0;padding:56px 20px 90px;overflow:hidden;animation:in .25s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.scr{animation:none}}
h1{font:800 34px/1.1 inherit;letter-spacing:-.02em;margin:8px 0 18px}
h3{font:700 20px/1.2 inherit;margin:18px 0 10px}
.hr{display:flex;gap:12px}.card{width:150px;cursor:pointer;flex:none}.card b{display:block;font-size:14px;margin-top:6px;font-weight:600}.card i{font-style:normal;color:#98989f;font-size:13px}
.art{border-radius:10px;flex:none;display:flex;align-items:flex-end;padding:8px;font-weight:700;color:rgba(255,255,255,.85)}
.tabs{position:absolute;bottom:0;left:0;right:0;height:84px;background:rgba(28,28,30,.96);border-top:1px solid #2c2c2e;display:flex;justify-content:space-around;padding-top:10px;font-size:10px;color:#98989f}
.tabs span{text-align:center}.tabs span.a{color:var(--ac)}.tabs em{display:block;font-style:normal;font-size:20px}
.np{text-align:center}.np .art{margin:18px auto 22px;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.np h2{font:700 22px/1.2 inherit;text-align:left}.np p{color:#98989f;text-align:left;font-size:18px}
.bar{height:5px;border-radius:3px;background:#3a3a3c;margin:22px 0 6px}.bar i{display:block;height:100%;width:6%;background:#fff;border-radius:3px}
.tm{display:flex;justify-content:space-between;font-size:11px;color:#98989f}
.ct{display:flex;justify-content:center;gap:46px;font-size:34px;margin:22px 0}
.bt{display:flex;justify-content:space-around;font-size:22px;color:#98989f;padding-top:6px}
.ib{background:none;border:0;color:inherit;font:inherit;cursor:pointer}
.hint{animation:pl 1.8s infinite;border-radius:50%}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(250,45,72,.6)}100%{box-shadow:0 0 0 14px rgba(250,45,72,0)}}
@media(prefers-reduced-motion:reduce){.hint{animation:none;outline:2px solid var(--ac)}}
.sh{position:absolute;left:0;right:0;bottom:0;background:#1c1c1e;border-radius:28px 28px 0 0;padding:14px 20px 28px;z-index:4;animation:in .25s ease}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:3}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.hd b{font:700 22px/1.2 inherit}
.flow{background:rgba(250,45,72,.18);color:var(--ac);border-radius:14px;padding:4px 10px;font-size:13px;font-weight:700}
.sub{color:#98989f;font-size:13px;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid #2c2c2e}
.row div.t{flex:1;min-width:0}.row b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row i{font-style:normal;color:#98989f;font-size:12px}
.row .g{color:#98989f;font-size:11px}.nw{color:var(--ac);font-size:11px;font-weight:700}.dot{width:7px;height:7px;border-radius:50%;background:var(--ac);flex:none}
.lt{opacity:.45}
.tip{background:#2c2c2e;border-radius:16px;padding:14px;margin:10px 0}.tip p{font-size:14px;margin-bottom:10px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:9px 16px;font:600 14px inherit;cursor:pointer}
.btn.g2{background:#3a3a3c}
.bn{background:rgba(250,45,72,.16);color:#ff7a8c;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;margin:6px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chips button{background:#2c2c2e;color:#fff;border:0;border-radius:16px;padding:8px 12px;font:13px inherit;cursor:pointer}
.sl{margin:16px 0}.sl label{display:flex;justify-content:space-between;font-size:13px;color:#98989f;margin-bottom:6px}
input[type=range]{width:100%;accent-color:#fa2d48}
.why{background:#2c2c2e;border-radius:18px;padding:16px;margin:10px 0}.why p{font-size:15px;margin-bottom:12px}
.why .r{display:flex;gap:8px}
.ftr{font-size:11px;color:var(--mu);text-align:center;margin-top:10px}
</style></head><body>
<div class="app">
<div class="rail"><h2>Adaptive Flow</h2><p class="s">Interactive prototype of the proposed Apple Music improvement. Tap inside the phone, or jump between steps.</p><div id="rl"></div>
<p class="note">Concept mockup, not affiliated with Apple. Songs are illustrative, not system output.</p></div>
<div><div class="wrap" id="wr"><div class="ph" id="ph"></div></div><p class="ftr" id="cp"></p></div>
</div>
<script>
const G=(a,b)=>`linear-gradient(145deg,${a},${b})`;
const S={a:['From the Start','Laufey','#d6a77a','#4a2c1d'],b:['Every Summertime','NIKI','#f6c667','#d9534f'],l:['Levitating','Dua Lipa','#ff4fa3','#5b1a8a'],r:['Best Friend','Rex Orange County','#8ec5a0','#1f4d4a'],h:['Heather','Conan Gray','#a9b7e8','#2c3a7a'],k:['Beside You','keshi','#7fb2e5','#1c2b52'],o:['Ocean Eyes','Billie Eilish','#9ad0d6','#1a3d4d'],v:['Valentine','Laufey','#e8a0b4','#5a2a3c'],p:['Bloom','The Paper Kites','#e6c27a','#6b4e2a'],c:['Cherry Wine','Hozier','#c97b7b','#4a1f26'],s:['Skinny Love','Bon Iver','#b8c4cf','#2f3a45']};
const Q={0:[['b','Mellow · similar tempo'],['l','Upbeat · higher energy'],['r','Mellow · acoustic'],['h','Mellow · evening'],['k','Chill · similar vocals']],
1:[['o','Mellow · low energy',1],['r','Mellow · acoustic'],['h','Mellow · evening'],['k','Chill · similar vocals'],['v','Mellow · same artist',1]],
2:[['o','Mellow · low energy'],['p','Soft folk · New to you',1],['c','Soulful · New to you',1],['s','Quiet · New to you',1],['v','Mellow · same artist']]};
const A=(k,z)=>`<div class="art" style="width:${z}px;height:${z}px;background:${G(S[k][2],S[k][3])};font-size:${z>100?18:11}px">${z>100?S[k][0].split(' ')[0]:''}</div>`;
const L=[['Home','Entry point','Tap From the Start. Nothing new to learn.'],['One song plays','Entry point','Tap the queue icon.'],['Adaptive Flow on','Main feature','Autoplay becomes Flow. No setup needed.'],['Next queue','Process','Built from song traits, taste and session. Tap Levitating.'],['Skip','Customer action','A fast skip is a signal. Chips explain why.'],['Queue adapts','Result','Calmer songs replace the upbeat one.'],['Shape My Flow','Customer action','Two sliders only. Drag toward Discovery.'],['Adapts again','Result','New-to-you songs, still mellow.'],['Why this song?','Output','Tap the info icon on a row.']];
let n=1,fam=50,chip=0;
const row=(x,i,info)=>`<div class="row ${x[3]?'lt':''}">${A(x[0],44)}<div class="t"><b>${S[x[0]][0]}</b><i>${S[x[0]][1]}</i><div class="g">${x[1]}</div></div>${x[2]?'<span class="dot"></span>':''}${info?`<button class="ib" aria-label="Why this song?" onclick="go(9)">ⓘ</button>`:''}</div>`;
const tabs=`<div class="tabs"><span class="a"><em>▶</em>Listen Now</span><span><em>▦</em>Browse</span><span><em>◉</em>Radio</span><span><em>♫</em>Library</span><span><em>⌕</em>Search</span></div>`;
const np=(k,hint)=>`<div class="scr np">${A(k,330)}<h2>${S[k][0]}</h2><p>${S[k][1]}</p><div class="bar"><i></i></div><div class="tm"><span>0:0${k=='l'?4:6}</span><span>-2:5${k=='l'?0:4}</span></div><div class="ct"><button class="ib" aria-label="Previous">⏮</button><button class="ib" aria-label="Pause">⏸</button><button class="ib ${hint=='skip'?'hint':''}" id="sk" aria-label="Next" onclick="skip()">⏭</button></div><div class="bt"><span>❝</span><span>◎</span><button class="ib ${hint=='q'?'hint':''}" aria-label="Playing Next" onclick="go(3)">☰</button></div></div>`;
const qh=`<div class="hd"><b>Playing Next</b><span class="flow">∞ Flow</span></div>`;
const list=(q,info)=>q.map(x=>row(x,0,info)).join('');
function draw(){let h='';const q=Q[n==8||n==9?2:n>=6?1:0],b=n==6?'Flow adjusted · calmer, lower energy':'Flow: more discovery, still mellow';
if(n==1)h=`<div class="scr"><h1>Listen Now</h1><h3 style="margin-top:0">Recently Played</h3><div class="hr"><div class="card hint" style="border-radius:12px" tabindex=0 onclick="go(2)" onkeydown="if(event.key=='Enter')go(2)">${A('a',150)}<b>From the Start</b><i>Laufey</i></div><div class="card">${A('r',150)}<b>Best Friend</b><i>Rex Orange County</i></div></div><h3>Top Picks for You</h3><div class="hr"><div class="card">${A('h',150)}<b>Heather</b><i>Conan Gray</i></div><div class="card">${A('k',150)}<b>Beside You</b><i>keshi</i></div></div></div>${tabs}`;
else if(n==2)h=np('a','q');
else if(n==3)h=np('a')+`<div class="dim"></div><div class="sh">${qh}<div class="sub">Starting from From the Start · Learning as you listen</div><div class="tip"><p><b>Start with one song.</b> Let Apple Music figure out what should come next.</p><button class="btn" onclick="go(4)">Got it</button></div></div>`;
else if(n==5)h=np('l','skip')+(chip?`<div class="sh" style="bottom:90px"><div class="sub">Skipped. What was off?</div><div class="chips">${['Not the mood','Heard it too much','Not this genre',"Don't like this song"].map(c=>`<button onclick="go(6)">${c}</button>`).join('')}</div></div>`:'');
else if(n==7)h=`<div class="scr">${qh}<div class="bn">Flow adjusted · calmer, lower energy</div>${list(q)}</div><div class="dim"></div><div class="sh"><div class="hd"><b>Shape My Flow</b><button class="ib" style="color:#fa2d48" onclick="fam=50;go(6)">Reset to automatic</button></div><div class="sl"><label><span>More Familiar</span><span>More Discovery</span></label><input type="range" min="0" max="100" value="${fam}" aria-label="Familiar to Discovery" onchange="fam=+this.value;go(fam>65?8:6)"></div><div class="sl"><label><span>Chill</span><span>Energetic</span></label><input type="range" min="0" max="100" value="30" aria-label="Chill to Energetic"></div><div class="sub">More options: Mainstream ↔ Indie · Same Genre ↔ Explore</div><button class="btn" onclick="go(fam>65?8:6)">Done</button></div>`;
else{h=`<div class="scr">${qh}<div class="sub">Starting from From the Start · Learning as you listen</div>${n>=6?`<div class="bn">${b}</div>`:''}<button class="btn g2" style="margin-bottom:8px" onclick="go(7)">Shape My Flow</button>${list(q,n>=4)}<div class="lt" style="margin-top:10px;font-size:12px;color:#98989f">Later · adjusts as you listen</div></div>`;
if(n==9)h+=`<div class="dim"></div><div class="sh"><div class="hd"><b>Why this song?</b><button class="ib" aria-label="Close" onclick="go(8)">✕</button></div><div class="why"><p>Recommended because you often listen to mellow pop in the evening, and you replayed <b>From the Start</b> earlier in this session.</p><div class="r"><button class="btn" onclick="go(8)">More like this</button><button class="btn g2" onclick="go(8)">Less like this</button></div></div><div class="sub">Show reasons: tap ⓘ on any song. Off by default.</div></div>`}
$('ph').innerHTML=`<div class="sb"><span>9:41</span><span>▂▄▆ ▮</span></div>`+h;
$('rl').innerHTML=L.map((l,i)=>`<button class="st ${i+1==n?'on':''}" onclick="go(${i+1})"><span style="font-weight:700;color:var(--ac)">${i+1}</span><span><b>${l[0]}</b><small>${l[1]}</small></span></button>`).join('');
$('cp').textContent=L[n-1][1]+': '+L[n-1][2];}
const $=i=>document.getElementById(i);
function go(k){n=k;chip=0;if(k==8&&fam<=65)fam=80;if(k<7&&k!=8)fam=k==6?fam:50;draw()}
function skip(){chip=1;draw()}
function fit(){const s=Math.min(1,(innerHeight-60)/852,(innerWidth-32)/393);document.documentElement.style.setProperty('--s',Math.max(.5,s))}
addEventListener('resize',fit);fit();draw();
</script></body></html>
